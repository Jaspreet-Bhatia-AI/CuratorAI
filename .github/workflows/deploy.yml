name: Deploy Curator AI to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Backend and Frontend to Server
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          
          # Use secrets.IP since the secret was named IP instead of HOST
          HOST_IP="${{ secrets.HOST || secrets.IP }}"
          
          # Sync backend (excluding venv and pycache)
          sshpass -p "${{ secrets.KEY }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no" --exclude 'venv' --exclude '__pycache__' backend/ ${{ secrets.USERNAME }}@${HOST_IP}:/home/${{ secrets.USERNAME }}/curator-ai/backend/
          
          # Sync built frontend (dist)
          sshpass -p "${{ secrets.KEY }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ ${{ secrets.USERNAME }}@${HOST_IP}:/home/${{ secrets.USERNAME }}/curator-ai/dist/

      - name: Restart Backend and Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST || secrets.IP }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/curator-ai/backend
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            pm2 restart curator-backend
            
            # Ensure permissions are correct for frontend files
            sudo chmod -R 755 /home/${{ secrets.USERNAME }}/curator-ai/dist
