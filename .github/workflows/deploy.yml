name: Deploy Curator AI to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Sync Backend and Frontend to Server
        run: |
          # Sync backend (excluding venv and pycache)
          rsync -avz --exclude 'venv' --exclude '__pycache__' backend/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/${{ secrets.USERNAME }}/curator-ai/backend/
          
          # Sync built frontend (dist)
          rsync -avz frontend/dist/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/${{ secrets.USERNAME }}/curator-ai/dist/

      - name: Restart Backend and Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/curator-ai/backend
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            pm2 restart curator-backend
            
            # Ensure permissions are correct for frontend files
            sudo chmod -R 755 /home/${{ secrets.USERNAME }}/curator-ai/dist
